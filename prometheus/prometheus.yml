global:
  scrape_interval: 30s

rule_files:
  - "/etc/prometheus/rules/high_cpu.yml"
  - "/etc/prometheus/rules/high_memory.yml"
  - "/etc/prometheus/rules/high_disk.yml"
  - "/etc/prometheus/rules/aws2_high_cpu.yml"
  - "/etc/prometheus/rules/aws2_high_memory.yml"
  - "/etc/prometheus/rules/aws2_high_disk.yml"  
  - "/etc/prometheus/rules/log_stale_mrsp.yml"
  - "/etc/prometheus/rules/log_stale_tcib.yml"
  - "/etc/prometheus/rules/server_down.yml"  
  - "/etc/prometheus/rules/vts_connector.yml"
  - "/etc/prometheus/rules/issuance_services.yml"
  - "/etc/prometheus/rules/tomcat-logs.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'localhost:9093'

scrape_configs:
- job_name: Job_01
  static_configs:
  - targets:
    - 192.168.1.1:9100
    labels:
      instance: ServerName(IP_Address)
  - targets:
    - IP_Address:9100
    labels:
      instance: ServerName(IP_Address)
